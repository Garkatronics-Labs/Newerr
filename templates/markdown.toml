header = "# Newerr Error Reference\n\n*Auto-generated by `newerr` — do not edit manually.*\n\n"
footer = "\n*Generated by `newerr`.*\n"

# Summary table: one row per error.
[[section]]
end = ""
prefix = "## Error Summary\n\n| ID | Name | Severity | Category |\n| --- | --- | --- | --- |\n"
suffix = "\n"
error = [
    { text = "| `{{id}}` | `{{name}}` | `{{severity}}` | `{{category}}` |\n" },
]

# Detail per category.
[[section]]
prefix = "---\n"
end = "\n"
category = [
    { text = "\n## `{{category}}`\n" },
    { text = "\n> {{category_description}}\n", skip_if_empty = "category_description" },
]
category_end = "\n"
error = [
    { text = "### `{{name}}` — `{{id}}`\n" },
    { text = "\n**Severity:** `{{severity}}` · **Category:** `{{category}}`\n" },
    { text = "\n{{message}}\n", skip_if_empty = "message" },
    { text = "\n> **Hint:** {{hint}}\n", skip_if_empty = "hint" },
]
suffix = "\n---\n"
